<!DOCTYPE html>
<html>
<head>
  <title>Place Data Fetch Test</title>
  <style>
    body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
    .section { margin: 20px 0; padding: 10px; background: #252526; border: 1px solid #444; }
  </style>
</head>
<body>
  <h1>Place Data Fetch Test</h1>
  <div id="result"></div>
  
  <script>
    async function test() {
      const resultDiv = document.getElementById('result');
      
      try {
        console.log("Fetching /tw-places.json...");
        const response = await fetch('/tw-places.json');
        console.log("Response OK:", response.ok);
        
        const data = await response.json();
        console.log("Parsed JSON successfully");
        console.log("Total zones:", Object.keys(data).length);
        
        const zone3045 = data['3045'];
        console.log("Zone 3045:", zone3045);
        
        resultDiv.innerHTML = `
          <div class="section">
            <strong>✓ Fetch successful</strong>
            <pre>
Size: ${Object.keys(data).length} zones
Zone 3045: ${JSON.stringify(zone3045, null, 2)}
            </pre>
          </div>
        `;
        
      } catch (error) {
        console.error("Error:", error);
        resultDiv.innerHTML = `<div class="section"><strong>✗ Error:</strong> ${error.message}</div>`;
      }
    }
    
    test();
  </script>
</body>
</html>
