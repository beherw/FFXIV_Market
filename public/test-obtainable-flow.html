<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon_bear.png" />
  <title>Obtainable Methods - Complete Data Flow Analysis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e1a;
      color: #e4e4e7;
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 1600px;
      margin: 0 auto;
    }
    h1 {
      color: #60a5fa;
      margin-bottom: 30px;
      font-size: 36px;
      text-align: center;
      text-shadow: 0 0 20px rgba(96, 165, 250, 0.5);
    }
    .controls {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 30px;
      border: 1px solid #334155;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .input-row {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
    }
    label {
      font-weight: 600;
      color: #94a3b8;
      min-width: 100px;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      color: #e4e4e7;
      font-size: 16px;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
    }
    button {
      padding: 12px 30px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .quick-tests {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .quick-tests button {
      padding: 8px 16px;
      font-size: 14px;
    }
    .status {
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
      border-left: 4px solid;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .status.loading {
      background: rgba(251, 191, 36, 0.1);
      color: #fbbf24;
      border-color: #fbbf24;
    }
    .status.success {
      background: rgba(34, 197, 94, 0.1);
      color: #22c55e;
      border-color: #22c55e;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border-color: #ef4444;
    }
    .timeline {
      position: relative;
      padding-left: 40px;
      margin-top: 30px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, #3b82f6, #8b5cf6);
    }
    .step {
      position: relative;
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 1px solid #334155;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: all 0.3s;
    }
    .step:hover {
      border-color: #60a5fa;
      box-shadow: 0 6px 30px rgba(96, 165, 250, 0.2);
    }
    .step::before {
      content: '';
      position: absolute;
      left: -30px;
      top: 30px;
      width: 16px;
      height: 16px;
      background: #3b82f6;
      border-radius: 50%;
      border: 3px solid #0a0e1a;
      box-shadow: 0 0 0 3px #3b82f6;
    }
    .step.completed::before {
      background: #22c55e;
      box-shadow: 0 0 0 3px #22c55e;
    }
    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      cursor: pointer;
      user-select: none;
    }
    .step-title {
      font-size: 20px;
      font-weight: 700;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .step-badge {
      background: rgba(96, 165, 250, 0.2);
      color: #60a5fa;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .step-time {
      color: #94a3b8;
      font-size: 14px;
    }
    .step-content {
      margin-top: 15px;
    }
    .data-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0;
      overflow-x: auto;
    }
    .data-box h4 {
      color: #a78bfa;
      margin-bottom: 10px;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .json-code {
      background: #020617;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      line-height: 1.6;
      max-height: 500px;
      overflow-y: auto;
      border: 1px solid #1e293b;
    }
    .json-code pre {
      margin: 0;
      color: #e4e4e7;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    .stat-card {
      background: rgba(96, 165, 250, 0.1);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid rgba(96, 165, 250, 0.2);
    }
    .stat-label {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 5px;
    }
    .stat-value {
      color: #60a5fa;
      font-size: 24px;
      font-weight: 700;
    }
    .expand-btn {
      background: none;
      border: none;
      color: #60a5fa;
      cursor: pointer;
      padding: 0;
      font-size: 20px;
      transition: transform 0.3s;
    }
    .expand-btn.collapsed {
      transform: rotate(-90deg);
    }
    .collapsible {
      max-height: 10000px;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
    }
    .collapsible.collapsed {
      max-height: 0;
    }
    .link-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(168, 85, 247, 0.2);
      color: #a855f7;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      margin: 3px;
    }
    .id-chip {
      display: inline-block;
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin: 2px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔬 Obtainable Methods - Complete Data Flow Analysis</h1>
    
    <div class="controls">
      <div class="input-row">
        <label for="itemId">Item ID:</label>
        <input type="number" id="itemId" placeholder="Enter item ID" value="5">
        <button id="analyzeBtn" onclick="startAnalysis()">🚀 Start Analysis</button>
      </div>
      <div style="margin-top: 15px;">
        <div style="color: #94a3b8; margin-bottom: 8px; font-size: 14px;">Quick Test Items:</div>
        <div class="quick-tests">
          <button onclick="testItem(5)">5 - Potion</button>
          <button onclick="testItem(36111)">36111 - Material</button>
          <button onclick="testItem(2)">2 - Fire Shard</button>
          <button onclick="testItem(5333)">5333 - Grade 3</button>
          <button onclick="testItem(7594)">7594 - Minion</button>
        </div>
      </div>
    </div>

    <div id="status"></div>
    <div id="timeline"></div>
  </div>

  <script type="module">
    import { getItemSources } from '/src/services/extractsService.js';
    import { extractIdsFromSources } from '/src/utils/extractIdsFromSources.js';
    import {
      getTwNpcsByIds,
      getNpcsByIds,
      getNpcsDatabasePagesByIds,
      getTwShopsByIds,
      getShopsByIds,
      getShopsByNpcIds,
      getTwInstancesByIds,
      getInstancesByIds,
      getZhInstancesByIds,
      getTwQuestsByIds,
      getQuestsByIds,
      getZhQuestsByIds,
      getQuestsDatabasePagesByIds,
      getTwFatesByIds,
      getFatesByIds,
      getZhFatesByIds,
      getFatesDatabasePagesByIds,
      getLevesDatabasePagesByIds,
      getTwAchievementsByIds,
      getTwAchievementDescriptionsByIds,
      getAchievementsByIds,
      getTwPlacesByIds,
      getPlacesByIds,
      getFateSourcesByItemId,
      getLootSourcesByItemId,
      getTwItemsByIds
    } from '/src/services/supabaseData.js';

    const DataTypeNames = {
      1: 'VENDORS', 2: 'REDUCED_FROM', 3: 'DESYNTHESIS', 4: 'INSTANCES',
      5: 'GARDENING', 6: 'VOYAGES', 7: 'VENTURES', 8: 'TREASURES',
      10: 'QUESTS', 11: 'FATES', 13: 'MOGSTATION', 14: 'ISLAND_PASTURE',
      15: 'ACHIEVEMENTS', 16: 'ISLAND_CROP', 17: 'ISLAND_GRANARY',
      18: 'EXCHANGE', 20: 'DROPS'
    };

    let stepCounter = 0;
    let startTime = 0;

    window.testItem = function(id) {
      document.getElementById('itemId').value = id;
      startAnalysis();
    };

    window.startAnalysis = async function() {
      const itemId = document.getElementById('itemId').value;
      if (!itemId) {
        showStatus('error', '❌ Please enter an item ID');
        return;
      }

      const analyzeBtn = document.getElementById('analyzeBtn');
      analyzeBtn.disabled = true;
      
      stepCounter = 0;
      startTime = performance.now();
      document.getElementById('timeline').innerHTML = '';
      
      showStatus('loading', `⏳ Starting analysis for Item ${itemId}...`);

      try {
        // STEP 1: Get item sources from Supabase extracts table
        await addStep('📥 Load Item Sources', async () => {
          const sources = await getItemSources(itemId);
          return {
            description: 'Query extracts table from Supabase for this item',
            table: 'extracts',
            query: `SELECT sources WHERE id = ${itemId}`,
            result: sources,
            stats: {
              'Source Types Found': sources.length,
              'Total Data Size': JSON.stringify(sources).length + ' bytes'
            }
          };
        });

        // Load sources again for next steps
        const sources = await getItemSources(itemId);
        
        // STEP 2: Extract IDs from sources
        const extractedIds = await addStep('🎯 Extract IDs from Sources', async () => {
          const ids = extractIdsFromSources(sources);
          return {
            description: 'Parse all sources and extract entity IDs that need to be queried',
            result: ids,
            stats: {
              'NPC IDs': ids.npcIds.length,
              'Shop IDs': ids.shopIds.length,
              'Instance IDs': ids.instanceIds.length,
              'Quest IDs': ids.questIds.length,
              'FATE IDs': ids.fateIds.length,
              'Achievement IDs': ids.achievementIds.length,
              'Item IDs': ids.itemIds.length,
              'Zone IDs': ids.zoneIds.length
            },
            links: [
              { from: 'VENDORS sources', to: 'npcIds, shopIds' },
              { from: 'INSTANCES sources', to: 'instanceIds' },
              { from: 'QUESTS sources', to: 'questIds' },
              { from: 'FATES sources', to: 'fateIds, zoneIds' },
              { from: 'ACHIEVEMENTS sources', to: 'achievementIds' },
              { from: 'EXCHANGE sources', to: 'npcIds, itemIds' }
            ]
          };
        });

        // STEP 3: Query NPCs (if any)
        if (extractedIds.npcIds.length > 0) {
          await addStep('👤 Load NPC Data', async () => {
            const [twNpcs, npcs, npcsDatabasePages] = await Promise.all([
              getTwNpcsByIds(extractedIds.npcIds),
              getNpcsByIds(extractedIds.npcIds),
              getNpcsDatabasePagesByIds(extractedIds.npcIds)
            ]);
            return {
              description: 'Fetch NPC information from multiple tables for localization and details',
              tables: ['tw_npcs', 'npcs', 'npcs_database_pages'],
              ids: extractedIds.npcIds,
              result: { twNpcs, npcs, npcsDatabasePages },
              stats: {
                'TW NPCs': Object.keys(twNpcs).length,
                'EN NPCs': Object.keys(npcs).length,
                'Database Pages': Object.keys(npcsDatabasePages).length
              },
              usage: 'Display NPC names in Chinese/English, show locations, link to wiki pages'
            };
          });
        }

        // STEP 4: Query Shops (if any)
        if (extractedIds.shopIds.length > 0 || extractedIds.npcIds.length > 0) {
          await addStep('🏪 Load Shop Data', async () => {
            const queries = [
              getTwShopsByIds(extractedIds.shopIds),
              getShopsByIds(extractedIds.shopIds)
            ];
            if (extractedIds.npcIds.length > 0) {
              queries.push(getShopsByNpcIds(extractedIds.npcIds));
            }
            const [twShops, shops, shopsByNpc] = await Promise.all(queries);
            return {
              description: 'Get shop information and link shops to NPCs',
              tables: ['tw_shops', 'shops', 'shops (by NPC)'],
              ids: { shopIds: extractedIds.shopIds, npcIds: extractedIds.npcIds },
              result: { twShops, shops, shopsByNpc: shopsByNpc || {} },
              stats: {
                'TW Shops': Object.keys(twShops).length,
                'EN Shops': Object.keys(shops).length,
                'Shops by NPC': shopsByNpc ? Object.keys(shopsByNpc).length : 0
              },
              usage: 'Show which NPCs sell this item, shop names, costs'
            };
          });
        }

        // STEP 5: Query Instances (if any)
        if (extractedIds.instanceIds.length > 0) {
          await addStep('🏰 Load Instance Data', async () => {
            const [twInstances, instances, zhInstances] = await Promise.all([
              getTwInstancesByIds(extractedIds.instanceIds),
              getInstancesByIds(extractedIds.instanceIds),
              getZhInstancesByIds(extractedIds.instanceIds)
            ]);
            return {
              description: 'Fetch dungeon/raid information for instance drops',
              tables: ['tw_instances', 'instances', 'zh_instances'],
              ids: extractedIds.instanceIds,
              result: { twInstances, instances, zhInstances },
              stats: {
                'TW Instances': Object.keys(twInstances).length,
                'EN Instances': Object.keys(instances).length,
                'ZH Instances': Object.keys(zhInstances).length
              },
              usage: 'Display instance names, levels, content type'
            };
          });
        }

        // STEP 6: Query Quests (if any)
        if (extractedIds.questIds.length > 0) {
          await addStep('📜 Load Quest Data', async () => {
            const [twQuests, quests, zhQuests, questsDatabasePages] = await Promise.all([
              getTwQuestsByIds(extractedIds.questIds),
              getQuestsByIds(extractedIds.questIds),
              getZhQuestsByIds(extractedIds.questIds),
              getQuestsDatabasePagesByIds(extractedIds.questIds)
            ]);
            return {
              description: 'Get quest information for quest rewards',
              tables: ['tw_quests', 'quests', 'zh_quests', 'quests_database_pages'],
              ids: extractedIds.questIds,
              result: { twQuests, quests, zhQuests, questsDatabasePages },
              stats: {
                'TW Quests': Object.keys(twQuests).length,
                'EN Quests': Object.keys(quests).length,
                'ZH Quests': Object.keys(zhQuests).length,
                'Database Pages': Object.keys(questsDatabasePages).length
              },
              usage: 'Show quest names, icons, levels, link to wiki'
            };
          });
        }

        // STEP 7: Query FATEs (if any)
        const fateSourcesIds = await getFateSourcesByItemId(itemId);
        const allFateIds = [...new Set([...extractedIds.fateIds, ...fateSourcesIds])];
        
        if (allFateIds.length > 0) {
          await addStep('⚔️ Load FATE Data', async () => {
            const [twFates, fates, zhFates, fatesDatabasePages] = await Promise.all([
              getTwFatesByIds(allFateIds),
              getFatesByIds(allFateIds),
              getZhFatesByIds(allFateIds),
              getFatesDatabasePagesByIds(allFateIds)
            ]);
            return {
              description: 'Fetch FATE information for FATE rewards',
              tables: ['tw_fates', 'fates', 'zh_fates', 'fates_database_pages', 'fate_sources'],
              ids: allFateIds,
              result: { twFates, fates, zhFates, fatesDatabasePages },
              stats: {
                'TW FATEs': Object.keys(twFates).length,
                'EN FATEs': Object.keys(fates).length,
                'ZH FATEs': Object.keys(zhFates).length,
                'Database Pages': Object.keys(fatesDatabasePages).length
              },
              usage: 'Display FATE names, levels, locations, link to wiki'
            };
          });
        }

        // STEP 8: Query Achievements (if any)
        if (extractedIds.achievementIds.length > 0) {
          await addStep('🏆 Load Achievement Data', async () => {
            const [twAchievements, twAchievementDescriptions, achievements] = await Promise.all([
              getTwAchievementsByIds(extractedIds.achievementIds),
              getTwAchievementDescriptionsByIds(extractedIds.achievementIds),
              getAchievementsByIds(extractedIds.achievementIds)
            ]);
            return {
              description: 'Get achievement data for achievement rewards',
              tables: ['tw_achievements', 'tw_achievement_descriptions', 'achievements'],
              ids: extractedIds.achievementIds,
              result: { twAchievements, twAchievementDescriptions, achievements },
              stats: {
                'TW Achievements': Object.keys(twAchievements).length,
                'TW Descriptions': Object.keys(twAchievementDescriptions).length,
                'EN Achievements': Object.keys(achievements).length
              },
              usage: 'Show achievement names, descriptions, icons'
            };
          });
        }

        // STEP 9: Query Places/Zones
        if (extractedIds.zoneIds.length > 0) {
          await addStep('🗺️ Load Place/Zone Data', async () => {
            const [twPlaces, places] = await Promise.all([
              getTwPlacesByIds(extractedIds.zoneIds),
              getPlacesByIds(extractedIds.zoneIds)
            ]);
            return {
              description: 'Fetch zone/map information for locations',
              tables: ['tw_places', 'places'],
              ids: extractedIds.zoneIds,
              result: { twPlaces, places },
              stats: {
                'TW Places': Object.keys(twPlaces).length,
                'EN Places': Object.keys(places).length
              },
              usage: 'Display location names for NPCs, FATEs, gathering points'
            };
          });
        }

        // STEP 10: Query Currency Items (if any)
        if (extractedIds.itemIds.length > 0) {
          await addStep('💰 Load Currency Item Data', async () => {
            const twItems = await getTwItemsByIds(extractedIds.itemIds);
            return {
              description: 'Get item names for currency/exchange items',
              tables: ['tw_items'],
              ids: extractedIds.itemIds,
              result: { twItems },
              stats: {
                'TW Items': Object.keys(twItems).length
              },
              usage: 'Display currency names in exchange shops'
            };
          });
        }

        // STEP 11: Query Loot Sources
        await addStep('🎁 Load Loot Sources', async () => {
          const lootSources = await getLootSourcesByItemId(itemId);
          return {
            description: 'Get monster drop information',
            tables: ['loot_sources'],
            result: { lootSources },
            stats: {
              'Monster IDs': lootSources.length
            },
            usage: 'Show which monsters drop this item (combined with drop-sources.json and monsters.json)'
          };
        });

        // STEP 12: Static JSON Files
        await addStep('📁 Static JSON Files', async () => {
          return {
            description: 'Additional static data files loaded on-demand',
            files: [
              { name: 'tw-npc-titles.json', usage: 'NPC title translations' },
              { name: 'tw-job-abbr.json', usage: 'Job abbreviations (e.g., "木工" for Carpenter)' },
              { name: 'tw-mobs.json', usage: 'Monster name translations' },
              { name: 'drop-sources.json', usage: 'Monster IDs that drop items' },
              { name: 'monsters.json', usage: 'Monster position/location data' },
              { name: 'tw-quests.json (lazy)', usage: 'Quest translations (loaded when needed)' },
              { name: 'tw-leves.json (lazy)', usage: 'Levequest translations (loaded when needed)' }
            ],
            note: 'These are imported directly or lazy-loaded when specific source types are present'
          };
        });

        const totalTime = ((performance.now() - startTime) / 1000).toFixed(2);
        showStatus('success', `✅ Analysis Complete! Total time: ${totalTime}s`);

      } catch (error) {
        console.error('Analysis error:', error);
        showStatus('error', `❌ Error: ${error.message}`);
      } finally {
        analyzeBtn.disabled = false;
      }
    };

    async function addStep(title, executor) {
      stepCounter++;
      const stepId = `step-${stepCounter}`;
      const stepStart = performance.now();
      
      // Create step element
      const timeline = document.getElementById('timeline');
      const stepDiv = document.createElement('div');
      stepDiv.className = 'step';
      stepDiv.id = stepId;
      stepDiv.innerHTML = `
        <div class="step-header" onclick="toggleStep('${stepId}')">
          <div class="step-title">
            <span class="step-badge">Step ${stepCounter}</span>
            ${title}
          </div>
          <div style="display: flex; align-items: center; gap: 15px;">
            <span class="step-time">Loading...</span>
            <button class="expand-btn">▼</button>
          </div>
        </div>
        <div class="collapsible" id="${stepId}-content">
          <div class="step-content">
            <div class="status loading">⏳ Executing...</div>
          </div>
        </div>
      `;
      timeline.appendChild(stepDiv);

      // Execute step
      try {
        const result = await executor();
        const duration = ((performance.now() - stepStart) / 1000).toFixed(3);
        
        // Update step with results
        stepDiv.classList.add('completed');
        stepDiv.querySelector('.step-time').textContent = `${duration}s`;
        
        let html = '';
        
        if (result.description) {
          html += `<div class="data-box"><p style="color: #cbd5e1;">${result.description}</p></div>`;
        }

        if (result.table || result.tables) {
          const tables = result.tables || [result.table];
          html += `<div class="data-box">
            <h4>📊 Database Tables:</h4>
            ${tables.map(t => `<span class="link-indicator">${t}</span>`).join('')}
          </div>`;
        }

        if (result.files) {
          html += `<div class="data-box">
            <h4>📄 Files:</h4>
            ${result.files.map(f => `
              <div style="margin: 10px 0; padding: 10px; background: rgba(168, 85, 247, 0.1); border-radius: 6px; border-left: 3px solid #a855f7;">
                <div style="font-weight: 600; color: #a855f7;">${f.name}</div>
                <div style="color: #94a3b8; font-size: 13px; margin-top: 5px;">${f.usage}</div>
              </div>
            `).join('')}
            ${result.note ? `<div style="margin-top: 10px; color: #94a3b8; font-style: italic;">${result.note}</div>` : ''}
          </div>`;
        }

        if (result.query) {
          html += `<div class="data-box">
            <h4>🔍 Query:</h4>
            <code style="color: #60a5fa;">${result.query}</code>
          </div>`;
        }

        if (result.ids) {
          html += `<div class="data-box">
            <h4>🎯 IDs Queried:</h4>
            <div class="json-code"><pre>${JSON.stringify(result.ids, null, 2)}</pre></div>
          </div>`;
        }

        if (result.stats) {
          html += `<div class="stat-grid">
            ${Object.entries(result.stats).map(([key, val]) => `
              <div class="stat-card">
                <div class="stat-label">${key}</div>
                <div class="stat-value">${val}</div>
              </div>
            `).join('')}
          </div>`;
        }

        if (result.links) {
          html += `<div class="data-box">
            <h4>🔗 Data Links:</h4>
            ${result.links.map(link => `
              <div style="margin: 5px 0;">
                <span class="link-indicator">${link.from}</span>
                <span style="color: #60a5fa; margin: 0 8px;">→</span>
                <span class="link-indicator">${link.to}</span>
              </div>
            `).join('')}
          </div>`;
        }

        if (result.usage) {
          html += `<div class="data-box">
            <h4>💡 Usage in Component:</h4>
            <p style="color: #cbd5e1;">${result.usage}</p>
          </div>`;
        }

        if (result.result) {
          html += `<div class="data-box">
            <h4>📦 Raw Data:</h4>
            <div class="json-code"><pre>${JSON.stringify(result.result, null, 2)}</pre></div>
          </div>`;
        }

        stepDiv.querySelector('.step-content').innerHTML = html;
        
        return result.result;
      } catch (error) {
        const duration = ((performance.now() - stepStart) / 1000).toFixed(3);
        stepDiv.querySelector('.step-time').textContent = `${duration}s (error)`;
        stepDiv.querySelector('.step-content').innerHTML = `
          <div class="status error">❌ Error: ${error.message}</div>
        `;
        throw error;
      }
    }

    function showStatus(type, message) {
      const statusDiv = document.getElementById('status');
      statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
    }

    window.toggleStep = function(stepId) {
      const content = document.getElementById(`${stepId}-content`);
      const btn = document.querySelector(`#${stepId} .expand-btn`);
      content.classList.toggle('collapsed');
      btn.classList.toggle('collapsed');
    };

    // Auto-run on load
    setTimeout(() => startAnalysis(), 100);
  </script>
</body>
</html>
