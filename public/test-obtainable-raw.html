<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon_bear.png" />
  <title>Obtainable Methods Raw Data Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 32px;
      border-bottom: 3px solid #667eea;
      padding-bottom: 10px;
    }
    .input-section {
      margin-bottom: 30px;
      padding: 20px;
      background: #f7f9fc;
      border-radius: 8px;
      border: 2px solid #e1e8ed;
    }
    .input-group {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 15px;
    }
    label {
      font-weight: 600;
      color: #555;
      min-width: 80px;
    }
    input {
      flex: 1;
      padding: 10px 15px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 6px;
      font-weight: 500;
    }
    .status.loading {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .data-section {
      margin-bottom: 30px;
    }
    .data-section h2 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 24px;
      padding: 10px;
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }
    .data-section h2:before {
      content: '▼ ';
      display: inline-block;
      transition: transform 0.3s;
    }
    .data-section h2.collapsed:before {
      transform: rotate(-90deg);
    }
    .data-section h3 {
      color: #764ba2;
      margin: 20px 0 10px 0;
      font-size: 18px;
      padding: 8px;
      background: #faf5ff;
      border-left: 3px solid #764ba2;
      cursor: pointer;
      user-select: none;
    }
    .data-section h3:before {
      content: '▼ ';
      display: inline-block;
      transition: transform 0.3s;
    }
    .data-section h3.collapsed:before {
      transform: rotate(-90deg);
    }
    .json-display {
      background: #2d2d2d;
      color: #f8f8f2;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      line-height: 1.6;
      max-height: 600px;
      overflow-y: auto;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
      white-space: pre-wrap;
      word-break: break-all;
    }
    .summary-box {
      background: #e8f5e9;
      border: 2px solid #4caf50;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #c8e6c9;
    }
    .summary-item:last-child {
      border-bottom: none;
    }
    .summary-label {
      font-weight: 600;
      color: #2e7d32;
    }
    .summary-value {
      color: #1b5e20;
      font-weight: 500;
    }
    .collapsible-content {
      max-height: 10000px;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
    }
    .collapsible-content.collapsed {
      max-height: 0;
    }
    .relationship-box {
      background: #fff3e0;
      border: 2px solid #ff9800;
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0;
    }
    .data-type-badge {
      display: inline-block;
      padding: 4px 10px;
      background: #667eea;
      color: white;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Obtainable Methods Raw Data Viewer</h1>
    
    <div class="input-section">
      <div class="input-group">
        <label for="itemId">Item ID:</label>
        <input type="number" id="itemId" placeholder="Enter item ID (e.g., 5)" value="5">
        <button id="analyzeBtn" onclick="analyzeData()">Analyze</button>
      </div>
      <div style="margin-top: 10px; color: #666; font-size: 14px;">
        <strong>Test IDs:</strong>
        <button onclick="testItem(5)" style="padding: 5px 10px; margin: 0 5px; font-size: 13px;">5</button>
        <button onclick="testItem(36111)" style="padding: 5px 10px; margin: 0 5px; font-size: 13px;">36111</button>
        <button onclick="testItem(2)" style="padding: 5px 10px; margin: 0 5px; font-size: 13px;">2</button>
        <button onclick="testItem(43858)" style="padding: 5px 10px; margin: 0 5px; font-size: 13px;">43858（兌換對照）</button>
      </div>
    </div>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script type="module">
    import { getItemSourcesById } from '/src/services/supabaseData.js';
    import { getObtainableSourcesById } from '/src/services/obtainableMethodsMsgpack.js';
    import { 
      getTwNpcsByIds,
      getNpcsByIds,
      getTwShopsByIds,
      getShopsByIds,
      getTwInstancesByIds,
      getInstancesByIds,
      getTwQuestsByIds,
      getQuestsByIds,
      getTwFatesByIds,
      getFatesByIds,
      getTwAchievementsByIds,
      getAchievementsByIds,
      getTwPlacesByIds,
      getPlacesByIds,
      getTwItemsByIds
    } from '/src/services/supabaseData.js';

    const DataTypeNames = {
      1: 'VENDORS',
      2: 'REDUCED_FROM',
      3: 'DESYNTHESIS',
      4: 'INSTANCES',
      5: 'GARDENING',
      6: 'VOYAGES',
      7: 'VENTURES',
      8: 'TREASURES',
      10: 'QUESTS',
      11: 'FATES',
      13: 'MOGSTATION',
      14: 'ISLAND_PASTURE',
      15: 'ACHIEVEMENTS',
      16: 'ISLAND_CROP',
      17: 'ISLAND_GRANARY',
      18: 'EXCHANGE',
      20: 'DROPS'
    };

    window.testItem = function(id) {
      document.getElementById('itemId').value = id;
      analyzeData();
    };

    window.analyzeData = async function() {
      const itemId = document.getElementById('itemId').value;
      const statusDiv = document.getElementById('status');
      const resultsDiv = document.getElementById('results');
      const analyzeBtn = document.getElementById('analyzeBtn');

      if (!itemId) {
        statusDiv.innerHTML = '<div class="status error">❌ Please enter an item ID</div>';
        return;
      }

      analyzeBtn.disabled = true;
      statusDiv.innerHTML = '<div class="status loading">⏳ Loading sources data...</div>';
      resultsDiv.innerHTML = '';

      try {
        // Step 1: Get sources from BOTH data sources for comparison
        statusDiv.innerHTML = '<div class="status loading">⏳ Loading both data sources...</div>';
        const [sourcesExtracts, sourcesApp] = await Promise.all([
          getItemSourcesById(itemId),
          getObtainableSourcesById(itemId).then(s => s || [])
        ]);
        // This page primarily shows Supabase "extracts" (raw); app uses obtainable-methods.json
        const sources = sourcesExtracts && sourcesExtracts.length > 0 ? sourcesExtracts : sourcesApp;

        if (!sources || sources.length === 0) {
          statusDiv.innerHTML = '<div class="status error">❌ No sources found for this item in either source</div>';
          analyzeBtn.disabled = false;
          return;
        }

        statusDiv.innerHTML = '<div class="status loading">⏳ Extracting IDs and loading related data...</div>';

        // Step 2: Extract all IDs from sources (include currencyItemId for type 2)
        const extractedIds = extractIdsFromSources(sources);

        // Step 3: Fetch related data
        const relatedData = await fetchRelatedData(extractedIds);

        // Display results (pass both for comparison)
        statusDiv.innerHTML = '<div class="status success">✅ Analysis Complete!</div>';
        displayResults(itemId, sources, extractedIds, relatedData, sourcesExtracts, sourcesApp);

      } catch (error) {
        console.error('Error:', error);
        statusDiv.innerHTML = `<div class="status error">❌ Error: ${error.message}</div>`;
      } finally {
        analyzeBtn.disabled = false;
      }
    };

    function extractIdsFromSources(sources) {
      const ids = {
        npcIds: new Set(),
        shopIds: new Set(),
        instanceIds: new Set(),
        questIds: new Set(),
        fateIds: new Set(),
        achievementIds: new Set(),
        itemIds: new Set(),
        zoneIds: new Set()
      };

      sources.forEach(source => {
        const type = source.type;
        const data = source.data;
        // TRADE_SOURCES / specialshop (type 2): top-level currencyItemId
        if (type === 2 && source.currencyItemId) {
          ids.itemIds.add(source.currencyItemId);
        }

        if (type === 1 && Array.isArray(data)) { // VENDORS
          data.forEach(item => {
            if (typeof item === 'object' && item.npcId) {
              ids.npcIds.add(item.npcId);
            } else if (typeof item === 'number') {
              ids.shopIds.add(item);
            }
          });
        } else if (type === 4 && Array.isArray(data)) { // INSTANCES
          data.forEach(id => ids.instanceIds.add(id));
        } else if (type === 10 && Array.isArray(data)) { // QUESTS
          data.forEach(item => {
            const questId = typeof item === 'object' ? item.id : item;
            ids.questIds.add(questId);
          });
        } else if (type === 11 && Array.isArray(data)) { // FATES
          data.forEach(item => {
            const fateId = typeof item === 'object' ? item.id : item;
            ids.fateIds.add(fateId);
            if (typeof item === 'object' && item.zoneId) {
              ids.zoneIds.add(item.zoneId);
            }
          });
        } else if (type === 15 && Array.isArray(data)) { // ACHIEVEMENTS
          data.forEach(item => {
            const achId = typeof item === 'object' ? item.id : item;
            ids.achievementIds.add(achId);
          });
        } else if (type === 18 && Array.isArray(data)) { // EXCHANGE
          data.forEach(npc => {
            if (npc.npcs && Array.isArray(npc.npcs)) {
              npc.npcs.forEach(npcId => ids.npcIds.add(npcId));
            }
            if (npc.trades && Array.isArray(npc.trades)) {
              npc.trades.forEach(trade => {
                if (trade.currencies && Array.isArray(trade.currencies)) {
                  trade.currencies.forEach(curr => {
                    if (curr.id) ids.itemIds.add(curr.id);
                  });
                }
              });
            }
          });
        }
      });

      return {
        npcIds: Array.from(ids.npcIds),
        shopIds: Array.from(ids.shopIds),
        instanceIds: Array.from(ids.instanceIds),
        questIds: Array.from(ids.questIds),
        fateIds: Array.from(ids.fateIds),
        achievementIds: Array.from(ids.achievementIds),
        itemIds: Array.from(ids.itemIds),
        zoneIds: Array.from(ids.zoneIds)
      };
    }

    async function fetchRelatedData(extractedIds) {
      const relatedData = {
        npcs: {},
        twNpcs: {},
        shops: {},
        twShops: {},
        instances: {},
        twInstances: {},
        quests: {},
        twQuests: {},
        fates: {},
        twFates: {},
        achievements: {},
        twAchievements: {},
        places: {},
        twPlaces: {},
        items: {},
        twItems: {}
      };

      // Fetch in batches using project services
      if (extractedIds.npcIds.length > 0) {
        const [npcs, twNpcs] = await Promise.all([
          getNpcsByIds(extractedIds.npcIds),
          getTwNpcsByIds(extractedIds.npcIds)
        ]);
        Object.assign(relatedData.npcs, npcs);
        Object.assign(relatedData.twNpcs, twNpcs);
      }

      if (extractedIds.shopIds.length > 0) {
        const [shops, twShops] = await Promise.all([
          getShopsByIds(extractedIds.shopIds),
          getTwShopsByIds(extractedIds.shopIds)
        ]);
        Object.assign(relatedData.shops, shops);
        Object.assign(relatedData.twShops, twShops);
      }

      if (extractedIds.instanceIds.length > 0) {
        const [instances, twInstances] = await Promise.all([
          getInstancesByIds(extractedIds.instanceIds),
          getTwInstancesByIds(extractedIds.instanceIds)
        ]);
        Object.assign(relatedData.instances, instances);
        Object.assign(relatedData.twInstances, twInstances);
      }

      if (extractedIds.questIds.length > 0) {
        const [quests, twQuests] = await Promise.all([
          getQuestsByIds(extractedIds.questIds),
          getTwQuestsByIds(extractedIds.questIds)
        ]);
        Object.assign(relatedData.quests, quests);
        Object.assign(relatedData.twQuests, twQuests);
      }

      if (extractedIds.fateIds.length > 0) {
        const [fates, twFates] = await Promise.all([
          getFatesByIds(extractedIds.fateIds),
          getTwFatesByIds(extractedIds.fateIds)
        ]);
        Object.assign(relatedData.fates, fates);
        Object.assign(relatedData.twFates, twFates);
      }

      if (extractedIds.achievementIds.length > 0) {
        const [achievements, twAchievements] = await Promise.all([
          getAchievementsByIds(extractedIds.achievementIds),
          getTwAchievementsByIds(extractedIds.achievementIds)
        ]);
        Object.assign(relatedData.achievements, achievements);
        Object.assign(relatedData.twAchievements, twAchievements);
      }

      if (extractedIds.zoneIds.length > 0) {
        const [places, twPlaces] = await Promise.all([
          getPlacesByIds(extractedIds.zoneIds),
          getTwPlacesByIds(extractedIds.zoneIds)
        ]);
        Object.assign(relatedData.places, places);
        Object.assign(relatedData.twPlaces, twPlaces);
      }

      if (extractedIds.itemIds.length > 0) {
        const twItems = await getTwItemsByIds(extractedIds.itemIds);
        Object.assign(relatedData.twItems, twItems);
      }

      return relatedData;
    }

    function displayResults(itemId, sources, extractedIds, relatedData, sourcesExtracts, sourcesApp) {
      const resultsDiv = document.getElementById('results');
      const fromExtracts = sourcesExtracts && sourcesExtracts.length > 0;
      const fromApp = sourcesApp && sourcesApp.length > 0;
      
      let html = `
        <div class="relationship-box" style="margin-bottom: 20px;">
          <strong>📌 資料來源說明</strong>
          <ul style="margin: 10px 0 0 20px; line-height: 1.8;">
            <li><b>Supabase extracts</b>：資料表 extracts，可能是舊版或不同管線（例如兌換會出現 currency 41785）。</li>
            <li><b>主站取得方式</b>：使用 <code>obtainable-methods.json</code>（getObtainableSourcesById），兌換用 <code>currencyItemId</code>（例如 45690）。</li>
            <li>若兩邊 currency 不同（41785 vs 45690），代表兩套資料不一致，主站以 obtainable-methods 為準。</li>
          </ul>
        </div>
        <div class="data-section">
          <h2>📊 Summary</h2>
          <div class="summary-box">
            <div class="summary-item">
              <span class="summary-label">Item ID:</span>
              <span class="summary-value">${itemId}</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">目前顯示來源:</span>
              <span class="summary-value">${fromExtracts ? 'Supabase extracts' : 'obtainable-methods.json'}（${sources.length} 筆）</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">NPC IDs:</span>
              <span class="summary-value">${extractedIds.npcIds.length}</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">Shop IDs:</span>
              <span class="summary-value">${extractedIds.shopIds.length}</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">Instance IDs:</span>
              <span class="summary-value">${extractedIds.instanceIds.length}</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">Quest IDs:</span>
              <span class="summary-value">${extractedIds.questIds.length}</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">FATE IDs:</span>
              <span class="summary-value">${extractedIds.fateIds.length}</span>
            </div>
          </div>
        </div>

        <div class="data-section">
          <h2 onclick="toggleSection(this)">📦 Raw Sources Data（目前顯示）</h2>
          <div class="collapsible-content">
            <div class="json-display">${JSON.stringify(sources, null, 2)}</div>
          </div>
        </div>
        ${(fromExtracts && fromApp) ? `
        <div class="data-section">
          <h2 onclick="toggleSection(this)">📋 主站用 obtainable-methods.json 同一物品</h2>
          <div class="collapsible-content">
            <p style="margin-bottom:10px; color:#666;">主站「取得方式」實際讀取的是這份資料，可對照上方 Raw 的 currency/currencyItemId。</p>
            <div class="json-display">${JSON.stringify(sourcesApp, null, 2)}</div>
          </div>
        </div>
        ` : (fromApp ? `
        <div class="data-section">
          <h2 onclick="toggleSection(this)">📋 主站用 obtainable-methods.json</h2>
          <div class="collapsible-content">
            <div class="json-display">${JSON.stringify(sourcesApp, null, 2)}</div>
          </div>
        </div>
        ` : '')}

        <div class="data-section">
          <h2 onclick="toggleSection(this)">🔗 Source Type Breakdown</h2>
          <div class="collapsible-content">
      `;

      sources.forEach((source, index) => {
        const typeName = DataTypeNames[source.type] || `Unknown (${source.type})`;
        html += `
          <div class="relationship-box">
            <div style="font-weight: 600; color: #e65100; margin-bottom: 10px;">
              <span class="data-type-badge">Type ${source.type}</span>
              ${typeName}
            </div>
            <div class="json-display" style="max-height: 300px;">${JSON.stringify(source.data, null, 2)}</div>
          </div>
        `;
      });

      html += `
          </div>
        </div>

        <div class="data-section">
          <h2 onclick="toggleSection(this)">🎯 Extracted IDs</h2>
          <div class="collapsible-content">
            <div class="json-display">${JSON.stringify(extractedIds, null, 2)}</div>
          </div>
        </div>

        <div class="data-section">
          <h2 onclick="toggleSection(this)">🗄️ Related Data from Supabase</h2>
          <div class="collapsible-content">
      `;

      const dataGroups = [
        { key: 'twNpcs', title: '👤 TW NPCs', data: relatedData.twNpcs },
        { key: 'npcs', title: '👤 NPCs (EN)', data: relatedData.npcs },
        { key: 'twShops', title: '🏪 TW Shops', data: relatedData.twShops },
        { key: 'shops', title: '🏪 Shops (EN)', data: relatedData.shops },
        { key: 'twInstances', title: '🏰 TW Instances', data: relatedData.twInstances },
        { key: 'instances', title: '🏰 Instances (EN)', data: relatedData.instances },
        { key: 'twQuests', title: '📜 TW Quests', data: relatedData.twQuests },
        { key: 'quests', title: '📜 Quests (EN)', data: relatedData.quests },
        { key: 'twFates', title: '⚔️ TW FATEs', data: relatedData.twFates },
        { key: 'fates', title: '⚔️ FATEs (EN)', data: relatedData.fates },
        { key: 'twAchievements', title: '🏆 TW Achievements', data: relatedData.twAchievements },
        { key: 'achievements', title: '🏆 Achievements (EN)', data: relatedData.achievements },
        { key: 'twPlaces', title: '🗺️ TW Places', data: relatedData.twPlaces },
        { key: 'places', title: '🗺️ Places (EN)', data: relatedData.places },
        { key: 'twItems', title: '💰 TW Items', data: relatedData.twItems }
      ];

      dataGroups.forEach(group => {
        const count = Object.keys(group.data).length;
        if (count > 0) {
          html += `
            <h3 onclick="toggleSection(this)">${group.title} (${count})</h3>
            <div class="collapsible-content">
              <div class="json-display">${JSON.stringify(group.data, null, 2)}</div>
            </div>
          `;
        }
      });

      html += `
          </div>
        </div>
      `;

      resultsDiv.innerHTML = html;
    }

    window.toggleSection = function(element) {
      element.classList.toggle('collapsed');
      const content = element.nextElementSibling;
      content.classList.toggle('collapsed');
    };

    // Auto-run on load
    setTimeout(() => analyzeData(), 100);
  </script>
</body>
</html>
