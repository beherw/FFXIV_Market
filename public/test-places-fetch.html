<!DOCTYPE html>
<html>
<head>
  <title>Test Places Fetch</title>
</head>
<body>
  <h1>Test Places Fetch</h1>
  <div id="result"></div>
  <script>
    const result = document.getElementById('result');
    
    async function testFetch() {
      try {
        const response = await fetch('/tw-places.json');
        const data = await response.json();
        
        result.innerHTML += `<p>✓ Fetched tw-places.json successfully</p>`;
        result.innerHTML += `<p>Size: ${Object.keys(data).length} zones</p>`;
        result.innerHTML += `<p>Has zoneId 3045: ${!!data['3045']}</p>`;
        result.innerHTML += `<p>Value for 3045: ${JSON.stringify(data['3045'])}</p>`;
        
      } catch (error) {
        result.innerHTML += `<p>✗ Error: ${error.message}</p>`;
      }
    }
    
    testFetch();
  </script>
</body>
</html>
