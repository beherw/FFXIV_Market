name: Sync CSV to Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'json_converter/**'
      - 'teamcraft_git/libs/data/src/lib/json/**'
  workflow_dispatch:

jobs:
  sync-supabase:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Convert JSON to CSV
        run: |
          cd json_converter
          node json_to_csv.js

      - name: Install Supabase client
        run: npm install @supabase/supabase-js

      - name: Debug Environment Variables
        run: |
          echo "Checking if environment variables are set..."
          if [ -z "$VITE_SUPABASE_URL" ]; then echo "❌ VITE_SUPABASE_URL is not set"; else echo "✓ VITE_SUPABASE_URL is set"; fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then echo "❌ VITE_SUPABASE_ANON_KEY is not set"; else echo "✓ VITE_SUPABASE_ANON_KEY is set"; fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sync CSV to Supabase (Smart Sync)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd json_converter
          node sync_smart.js
        continue-on-error: false

      - name: Summary
        if: always()
        run: |
          echo "Supabase sync completed"
          echo "Check the logs above for details"
